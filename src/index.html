<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Studio</title>

<style>
:root {
  color-scheme: light;
  --bg: #eef0f3; --surface: #ffffff; --surface-2: #f6f7f9; --surface-3: #eaecf0; --line: #dde1e7;
  --text: #1c1f24; --text-2: #656b76; --accent: #3b6ef5;
  --shadow-1: 0 1px 2px rgb(16 24 40 / .06), 0 1px 3px rgb(16 24 40 / .08);
  --shadow-2: 0 6px 16px rgb(16 24 40 / .10), 0 2px 4px rgb(16 24 40 / .06);
  --shadow-3: 0 24px 48px rgb(16 24 40 / .20);
  --c-video: #4f8cff; --c-image: #22a699; --c-bubble: #e9a23b; --c-avatar: #a77bf3; --c-background: #4fb466; --c-action: #e0608b; --c-audio: #36a9c1;
  --c-title: #c9a20c; --c-shape: #ef6c4a; --c-redact: #7d8597; --c-adjust: #6f8fb0; --c-effect: #2fb8c4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111215; --surface: #1a1c20; --surface-2: #212328; --surface-3: #2a2d33; --line: #32353c;
    --text: #e6e8ec; --text-2: #9a9fa9; --accent: #7aa2ff;
    --shadow-1: 0 1px 2px rgb(0 0 0 / .35), 0 1px 3px rgb(0 0 0 / .25);
    --shadow-2: 0 6px 16px rgb(0 0 0 / .40), 0 2px 4px rgb(0 0 0 / .30);
    --shadow-3: 0 24px 48px rgb(0 0 0 / .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111215; --surface: #1a1c20; --surface-2: #212328; --surface-3: #2a2d33; --line: #32353c;
  --text: #e6e8ec; --text-2: #9a9fa9; --accent: #7aa2ff;
  --shadow-1: 0 1px 2px rgb(0 0 0 / .35), 0 1px 3px rgb(0 0 0 / .25);
  --shadow-2: 0 6px 16px rgb(0 0 0 / .40), 0 2px 4px rgb(0 0 0 / .30);
  --shadow-3: 0 24px 48px rgb(0 0 0 / .55);
}
body {
  margin: 0; height: 100dvh; display: grid; grid-template-rows: 52px minmax(0, 1fr); overflow: hidden;
  background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.toolbar { display: flex; align-items: center; gap: 2px; padding: 0 12px; background: var(--surface); box-shadow: var(--shadow-1); z-index: 2; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; margin-right: 14px; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 8px; }
.spacer { flex: 1; }
main {
  display: grid; min-height: 0; padding: 10px; gap: 0 10px;
  grid-template-columns: 250px minmax(0, 1fr) 310px;
  grid-template-rows: minmax(0, 1fr) 10px var(--tl-h, 290px);
}
vt-assets { grid-area: 1 / 1; } vt-viewport { grid-area: 1 / 2; } vt-props { grid-area: 1 / 3; }
.splitter { grid-area: 2 / 1 / 3 / 4; cursor: row-resize; }
vt-timeline { grid-area: 3 / 1 / 4 / 4; }
.panel { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-1); overflow: hidden; min-height: 0; min-width: 0; }
#add-btn { anchor-name: --add; } #save-btn { anchor-name: --save; }
@supports (anchor-name: --a) {
  #add-menu, #save-menu { inset: auto; top: anchor(bottom); left: anchor(left); margin-top: 6px; }
  #add-menu { position-anchor: --add; } #save-menu { position-anchor: --save; }
}
#save-menu small { margin-left: auto; padding-left: 16px; color: var(--text-2); font-size: 11px; }
.autosave { display: flex; align-items: center; gap: 6px; margin-right: 8px; color: var(--text-2); font-size: 12px; white-space: nowrap; }
.autosave[data-state="off"], .autosave[data-state="error"] { opacity: .6; }
.autosave[data-state="pending"] .icon { opacity: .5; }
#toast { inset: auto 16px 16px auto; margin: 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--surface); color: var(--text); box-shadow: var(--shadow-2); max-width: 420px; }
@media (max-width: 900px) {
  body { overflow: auto; height: auto; }
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 50vh auto auto 10px 320px; }
  vt-viewport { grid-area: 1 / 1; } vt-props { grid-area: 2 / 1; margin-top: 10px; max-height: 60vh; } vt-assets { grid-area: 3 / 1; margin-top: 10px; max-height: 50vh; }
  .splitter { grid-area: 4 / 1; } vt-timeline { grid-area: 5 / 1; }
  .brand span, .autosave span { display: none; }
}
</style>
<style id="base">
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
.icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button, input, select, textarea { font: inherit; color: inherit; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: background .15s, box-shadow .15s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); box-shadow: var(--shadow-1); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.primary:hover { box-shadow: var(--shadow-2); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--text-2); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn[aria-pressed="true"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
input, select, textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-width: 0; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type="range"] { accent-color: var(--accent); padding: 0; border: 0; background: transparent; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
input[type="color"] { padding: 2px; height: 28px; width: 48px; cursor: pointer; }
textarea { resize: vertical; min-height: 68px; width: 100%; }
.menu { margin: 0; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); box-shadow: var(--shadow-2); min-width: 210px; }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 7px 10px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; text-align: left; }
.menu button:hover { background: var(--surface-3); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu label { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.menu label:hover { background: var(--surface-3); }
.menu label small { margin-left: auto; padding-left: 16px; color: var(--text-2); font-size: 11px; }
.icon-btn:disabled { opacity: .4; cursor: default; background: transparent; }
.menu .row .btn { width: auto; flex: none; padding: 0 12px; }
.menu .btn.primary:hover { background: var(--accent); }
#add-menu { max-height: min(72vh, 680px); overflow: auto; }
.menu h4 { margin: 8px 10px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
</style>

<template id="tpl-vt-field">
<style>
:host { display: grid; grid-template-columns: 96px minmax(0, 1fr) 26px; align-items: center; gap: 4px 8px; min-height: 30px; }
:host([wide]) { grid-template-columns: minmax(0, 1fr) 26px; }
:host([wide]) label { grid-column: 1 / -1; }
label { color: var(--text-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctl { display: flex; gap: 6px; align-items: center; min-width: 0; }
.ctl > :only-child { flex: 1; }
.ctl input[type="range"] { flex: 1; }
.ctl input[type="number"] { width: 68px; flex: none; }
.ctl input[type="color"], .ctl input[type="checkbox"] { flex: none; }
.key { width: 26px; height: 26px; }
.key .icon { width: 14px; height: 14px; }
.key[data-state="none"] { opacity: .45; }
.key[data-state="has"] { color: var(--accent); }
.key[data-state="on"] { color: var(--accent); }
.key[data-state="on"] .icon { fill: currentColor; }
.ease { grid-column: 2 / 3; font-size: 12px; }
</style>
<label></label><div class="ctl"></div>
<button class="icon-btn key" hidden title="Add or remove a keyframe at the playhead"><svg class="icon"><use href="#i-diamond"/></svg></button>
<select class="ease" hidden title="Easing from this keyframe to the next"></select>
</template>

<template id="tpl-vt-props">
<style>
:host { display: grid; grid-template-rows: auto minmax(0, 1fr); }
header { display: flex; align-items: center; gap: 2px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--line); min-height: 50px; }
header .type { margin-right: 8px; }
.titles { flex: 1; min-width: 0; }
.title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { color: var(--text-2); font-size: 12px; }
.body { overflow: auto; padding: 0 14px 16px; }
details { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
summary { cursor: pointer; padding: 12px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); list-style: none; display: flex; justify-content: space-between; }
summary::after { content: "–"; }
details:not([open]) summary::after { content: "+"; }
.fields { display: grid; gap: 4px; }
.note { color: var(--text-2); font-size: 12px; margin: 14px 0 0; }
[hidden] { display: none !important; }
.star { anchor-name: --star; }
.preset-pop { width: 280px; }
.preset-pop form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 6px; }
.preset-pop .row { display: flex; gap: 6px; }
.preset-pop input { flex: 1; }
.preset-pop p { margin: 0; font-size: 12px; color: var(--text-2); }
@supports (anchor-name: --a) { .preset-pop { position-anchor: --star; inset: auto; top: anchor(bottom); right: anchor(right); margin-top: 6px; } }
</style>
<header>
  <svg class="icon type"><use href="#i-sliders"/></svg>
  <div class="titles"><div class="title"></div><div class="sub"></div></div>
  <button class="icon-btn brush" title="Copy style (Ctrl+Alt+C)"><svg class="icon"><use href="#i-brush"/></svg></button>
  <button class="icon-btn paste" title="Paste style (Ctrl+Alt+V)"><svg class="icon"><use href="#i-paste"/></svg></button>
  <button class="icon-btn star" popovertarget="preset-pop" title="Save as preset"><svg class="icon"><use href="#i-star"/></svg></button>
  <button class="icon-btn dup" title="Duplicate (Ctrl+D)"><svg class="icon"><use href="#i-copy"/></svg></button>
  <button class="icon-btn del" title="Delete (Del)"><svg class="icon"><use href="#i-trash"/></svg></button>
</header>
<div class="body"></div>
<div id="preset-pop" class="menu preset-pop" popover>
  <form>
    <p>Save this clip's look and animation as a preset in the Assets panel.</p>
    <div class="row"><input name="label" placeholder="Preset name" required><button class="btn primary">Save</button></div>
  </form>
</div>
</template>

<template id="tpl-vt-assets">
<style>
:host { display: grid; grid-template-rows: auto minmax(0, 1fr); }
:host(.dragover) { outline: 2px dashed var(--accent); outline-offset: -4px; }

  constructor(engine, premul, fragmentShader, extra) {
    this.engine = engine;
    this.mesh = new THREE.Mesh(UNIT_PLANE, compMaterial(premul, fragmentShader, extra));
    engine.scene.add(this.mesh);

  own(tex) { this.textures.push(tex); return tex; }

  place(p, m, w, hgt, ox = 0, oy = 0) {

    this.mesh.rotation.z = r;
    this.mesh.scale.set(Math.max(1e-6, w * s), Math.max(1e-6, hgt * s), 1);
    mat.uniforms.opacity.value = clamp(p.opacity * m.opacity);

    this.mesh.material.dispose();

}

class ImageLayer extends Layer {
  constructor(engine, clip) {
    super(engine, false);
    this.m = media.get(clip.props.asset);
    if (!this.m) return;
    this.img = Object.assign(new Image(), { src: this.m.url });
    this.tex = this.own(Object.assign(new THREE.Texture(this.img), { colorSpace: SRGB }));
    this.img.decode().then(() => { this.tex.needsUpdate = true; engine.requestRender(); }, () => {});
    this.canvas = document.createElement('canvas');
    this.sticker = this.own(Object.assign(new THREE.CanvasTexture(this.canvas), { colorSpace: SRGB }));
  }
  update(lt, clip) {
    if (!this.img?.naturalWidth) return void (this.mesh.visible = false);
    const { W, H } = this.engine, k = H / 1080, p = evalAll(clip, lt), iw = this.img.naturalWidth;
    let [w, hgt] = fitSize(p.fit, iw, this.img.naturalHeight, W, H);
    if (p.border > 0 || p.shadow > 0) {
      const res = Math.min(1, 2048 / Math.max(iw, this.img.naturalHeight)), px = iw * res / w;
      const key = JSON.stringify([res, ...[p.border, p.shadow, p.shadowY].map(v => Math.round(v * k * px * 2) / 2), p.borderColor, p.shadowOpacity]);
      if (key !== this.key) {

        const size = [this.canvas.width, this.canvas.height];
        drawSticker(this.canvas, this.img, res, p.border * k * px, p.borderColor, p.shadow * k * px, p.shadowY * k * px, p.shadowOpacity);
        if (size[0] !== this.canvas.width || size[1] !== this.canvas.height) this.sticker.dispose();
        this.sticker.needsUpdate = true;

      this.setTexture(this.sticker);
      [w, hgt] = [this.canvas.width / px, this.canvas.height / px];
    } else this.setTexture(this.tex);
    this.place(p, transitionMods(clip, lt), w, hgt);
  }
}

const audioGain = (clip, lt) => (evalProp(clip, 'volume', lt) ?? 1) * (clip.type === 'audio' ? transitionMods(clip, lt).opacity : 1);

class MediaLayer extends Layer {
  attach(tag) {
    this.el = Object.assign(document.createElement(tag), { src: this.m.url, playsInline: true, preload: 'auto' });
    this.el.addEventListener('seeked', () => this.engine.requestRender());
    return this.el;
  }
  sync(src, gain) {
    const el = this.el;
    el.volume = clamp(gain);
    el.muted = !store.playing || gain <= 0;
    if (store.playing) {
      if (Math.abs(el.currentTime - src) > .25) el.currentTime = src;
      if (el.paused) el.play().catch(() => {});
    } else {
      if (!el.paused) el.pause();
      if (!el.seeking && Math.abs(el.currentTime - src) > .5 / store.project.settings.fps) el.currentTime = src;
    }
  }
  idle() { if (this.el && !this.el.paused) this.el.pause(); }
  dispose() {
    super.dispose();
    if (this.el) { this.el.pause(); this.el.removeAttribute('src'); this.el.load(); }
  }
}

class VideoLayer extends MediaLayer {
  exportFrame = null;
  constructor(engine, clip) {
    super(engine, false);
    this.m = media.get(clip.props.asset);
    if (!this.m) return;
    this.vtex = this.own(new THREE.VideoTexture(this.attach('video')));
    this.vtex.colorSpace = SRGB;
  }
  update(lt, clip, ctx) {
    if (!this.m) return void (this.mesh.visible = false);
    const p = evalAll(clip, lt);
    if (ctx.exporting) {
      if (this.exportFrame) {
        this.etex ??= Object.assign(this.own(new THREE.CanvasTexture(this.exportFrame)), { colorSpace: SRGB });
        this.etex.image = this.exportFrame;
        this.etex.needsUpdate = true;
        this.setTexture(this.etex);
      }
    } else {
      this.setTexture(this.vtex);
      this.sync(clip.in + lt, audioGain(clip, lt));
      if (!store.playing && this.el.readyState >= 2) this.vtex.needsUpdate = true;
    }
    this.place(p, transitionMods(clip, lt), ...fitSize(p.fit, this.m.width, this.m.height, this.engine.W, this.engine.H));
  }
}

class AudioLayer extends MediaLayer {
  constructor(engine, clip) {
    super(engine, false);
    this.m = media.get(clip.props.asset);
    if (this.m) this.attach('audio');
  }
  update(lt, clip, ctx) {
    this.mesh.visible = false;
    if (this.m && !ctx.exporting) this.sync(clip.in + lt, audioGain(clip, lt));
  }
}

class SceneLayer extends Layer {
  constructor(engine, clip) {
    super(engine, true);
    const { W, H } = engine, def = plugins.get(clip.plugin);
    this.rt = new THREE.WebGLRenderTarget(W, H, { samples: 4, type: THREE.HalfFloatType, depthTexture: new THREE.DepthTexture(W, H) });
    this.setTexture(this.rt.texture);
    if (!def) return;
    this.inst = def.create({ THREE, width: W, height: H, rng: mulberry32, fullscreen });
    this.camera = this.inst.camera;
    if (!this.camera) {
      this.camera = new THREE.PerspectiveCamera(30, W / H, .1, 100);
      this.camera.position.set(0, .85, 9);
      this.camera.lookAt(0, .85, 0);
    }
  }
  update(lt, clip, ctx) {
    if (!this.inst) return void (this.mesh.visible = false);
    const { renderer, W, H } = this.engine, p = evalAll(clip, lt);
    this.inst.update(lt + clip.in, p, { talking: ctx.talking.get(clip.id) ?? 0, actions: ctx.actions.get(clip.id) ?? [], width: W, height: H });
    renderer.setRenderTarget(this.rt);
    renderer.setClearColor(0x000000, 0);
    renderer.render(this.inst.scene, this.camera);
    if (p.outline && (p.lineWidth > 0 || p.creases > 0)) {
      this.ink ??= new OutlinePass(W, H);
      this.ink.render(renderer, this.rt, this.camera, p, lt + clip.in, H / 1080);
      this.setTexture(this.ink.rt.texture);

    this.place(p, transitionMods(clip, lt), W, H);
  }

    const a = this.inst.anchor?.(kind) ?? (kind === 'body' ? new THREE.Vector3() : null);
    if (!a) return null;
    const ndc = a.clone().project(this.camera);
    return this.mesh.localToWorld(new THREE.Vector3(ndc.x / 2, ndc.y / 2, 0));
  }
  dispose() { super.dispose(); this.rt.depthTexture.dispose(); this.rt.dispose(); this.ink?.dispose(); this.inst?.dispose?.(); }
}

const fontTried = new Set();
class CanvasLayer extends Layer {
  constructor(engine) {
    super(engine, false, new.target.shader, new.target.uniforms && uniformsOf(new.target.uniforms()));
    this.canvas = document.createElement('canvas');
    this.tex = this.own(Object.assign(new THREE.CanvasTexture(this.canvas), { colorSpace: SRGB }));
    this.setTexture(this.tex);
  }
  paint(key, fonts, draw) {
    key = JSON.stringify(key);
    if (key === this.key) return;
    this.key = key;
    for (const f of fonts) if (!fontTried.has(f) && !document.fonts.check(f)) {
      fontTried.add(f);
      document.fonts.load(f).then(() => { this.key = null; this.engine.requestRender(); });
    }
    const size = [this.canvas.width, this.canvas.height];
    this.box = draw(this.canvas);
    if (size[0] !== this.canvas.width || size[1] !== this.canvas.height) this.tex.dispose();
    this.tex.needsUpdate = true;
  }
}

class BubbleLayer extends CanvasLayer {
  update(lt, clip) {
    const { W, H, layers } = this.engine, k = H / 1080, p = evalAll(clip, lt), m = transitionMods(clip, lt);
    const speaker = p.avatar && p.follow !== 'none' && layers.get(p.avatar);
    const anchor = speaker?.active ? speaker.anchorPx?.(p.track) : null;
    if (anchor && p.follow === 'bubble') Object.assign(p, { x: anchor.x / W * 100 + p.offsetX, y: (1 - anchor.y / H) * 100 + p.offsetY });
    const s = Math.max(1e-6, p.scale * m.scale), rot = (p.rotation + m.rot) * deg;
    const cx = W * (p.x / 100 + m.dx), cy = H * (1 - p.y / 100 - m.dy);
    const target = anchor ?? { x: W * p.tailX / 100, y: H * (1 - p.tailY / 100) };
    let dx = target.x - cx, dy = target.y - cy;
    const len = Math.hypot(dx, dy), keep = len ? Math.max(0, Math.min(len, 2 * H) - p.tailGap * k) / len : 0;
    dx *= keep; dy *= keep;
    const c = Math.cos(rot), sn = Math.sin(rot), cap = Math.min(1 / s, 2 * H / (Math.hypot(dx, dy) || 1));
    const tip = [(dx * c - dy * sn) * cap, -(dx * sn + dy * c) * cap];
    this.paint([p.text, p.style, p.font, p.weight, p.fontSize, p.maxWidth, p.padding, p.fill, p.stroke, p.strokeWidth, p.ink, k,
      Math.round(m.reveal * p.text.length), Math.round(tip[0]), Math.round(tip[1])], [`${p.weight} 40px "${p.font}"`], cv => drawBubble(cv, p, k, m.reveal, tip));
    this.place(p, m, this.box.w, this.box.h, this.box.ox, -this.box.oy);
  }
}

const TITLE_FRAG = `uniform sampler2D map, tBlur; uniform float opacity, uRadius, uBright, uSat; uniform bool uGlass;
uniform vec4 uPanel; uniform vec2 uCanvas, uRes; varying vec2 vUv;
${GLSL_GRADE}
void main() {
  vec4 c = texture2D(map, vUv);
  c.rgb *= c.a;
  if (uGlass) {
    vec2 q = abs(vec2(vUv.x, 1. - vUv.y) * uCanvas - uPanel.xy - uPanel.zw * .5) - uPanel.zw * .5 + uRadius;
    float m = clamp(.5 - (length(max(q, 0.)) + min(max(q.x, q.y), 0.) - uRadius), 0., 1.);

    c += vec4(g, 1.) * m * (1. - c.a);
  }

const imageCache = new Map();
function imageOf(id) {
  const url = media.get(id)?.url;

  if (!imageCache.has(url)) {
    const img = Object.assign(new Image(), { src: url });
    imageCache.set(url, img);
    img.decode().then(() => engine.requestRender(), () => {});
  }
  const img = imageCache.get(url);
  return img.complete && img.naturalWidth ? img : null;

class TitleLayer extends CanvasLayer {
  static shader = TITLE_FRAG;
  static uniforms = () => ({ tBlur: null, uGlass: false, uPanel: new THREE.Vector4(), uCanvas: new THREE.Vector2(), uRadius: 0, uRes: new THREE.Vector2(), uBright: 0, uSat: 1 });
  blur = new Blur();
  update(lt, clip) {
    const { W, H } = this.engine, k = H / 1080, p = evalAll(clip, lt), m = transitionMods(clip, lt), u = this.mesh.material.uniforms;
    const img = p.bg === 'image' ? imageOf(p.image) : null;
    this.paint([lookOf(p), W, k, !!img, Math.round(m.reveal * (p.title.length + p.subtitle.length))],
      [`${p.weight} 40px "${p.font}"`, `${p.subWeight} 40px "${p.subFont}"`], cv => drawTitle(cv, p, k, m.reveal, W, H, img));
    this.backdrop = p.bg === 'backdrop' && p.style !== 'plain';
    this.sigma = (p.glassBlur ?? 0) * k;
    const [x, y, w, hgt, r] = this.box.panel;
    u.uGlass.value = this.backdrop;
    u.uPanel.value.set(x, y, w, hgt);
    u.uRadius.value = r;
    u.uCanvas.value.set(this.canvas.width, this.canvas.height);
    u.uRes.value.set(W, H);
    u.uBright.value = p.glassBright ?? 0;
    u.uSat.value = p.glassSat ?? 1;

  }
  prepare(back) { this.mesh.material.uniforms.tBlur.value = this.blur.run(this.engine.renderer, back, this.sigma, this.engine.W, this.engine.H); }
  dispose() { super.dispose(); this.blur.dispose(); }
}

class ShapeLayer extends CanvasLayer {
  update(lt, clip) {
    const k = this.engine.H / 1080, p = evalAll(clip, lt), m = transitionMods(clip, lt), f = (lt * p.animSpeed) % 1, wave = Math.sin(f * TAU) * p.animAmount;
    if (p.anim === 'pulse') m.scale *= 1 + .08 * wave;

class RedactLayer extends FilterLayer {
  constructor(engine) { super(engine, REDACT_FRAG, { uColor: new THREE.Color(), uAmount: 24, uMode: 0 }); }
  update(lt, clip) {
    const k = this.engine.H / 1080, p = evalAll(clip, lt), u = this.mesh.material.uniforms;
    this.aim(p);
    this.region(p, transitionMods(clip, lt));
    u.uAmount.value = p.amount * k;
    u.uColor.value.set(p.color);
    u.uMode.value = Math.max(0, ['blur', 'pixelate', 'solid'].indexOf(p.mode));
    this.sigma = { blur: .5, pixelate: .35 }[p.mode] * p.amount * k || 0;
  }
}

class AdjustLayer extends FilterLayer {
  constructor(engine) {
    super(engine, ADJUST_FRAG, { uTint: new THREE.Color(), uBlur: 0, uBright: 0, uContrast: 1, uSat: 1, uHue: 0, uTintAmt: 0, uChroma: 0, uVignette: 0, uGrain: 0, uTime: 0 });
  }
  update(lt, clip, ctx) {
    const k = this.engine.H / 1080, p = evalAll(clip, lt), u = this.mesh.material.uniforms;
    this.aim(p);
    this.region(p, transitionMods(clip, lt));
    this.sigma = p.blur * k;
    u.uTint.value.set(p.tint);
    Object.entries({ uBlur: this.sigma, uBright: p.brightness, uContrast: p.contrast, uSat: p.saturation, uHue: p.hue, uTintAmt: p.tintAmount,

class EffectLayer extends FilterLayer {
  pickable = false; jfa = new JumpFlood();
  constructor(engine) {
    super(engine, EFFECT_FRAG, { tSeed: null, uOffset: new THREE.Vector2(), uColor: new THREE.Color(), uColor2: new THREE.Color(),
      uRadius: 24, uStrength: 1, uWidth: 6, uGap: 0, uMode: 0, uRings: 2, uKeep: true });
  }
  update(lt, clip) {
    const { W, H } = this.engine, k = H / 1080, p = evalAll(clip, lt), u = this.mesh.material.uniforms;
    this.aim(p, true);
    this.frame(p, transitionMods(clip, lt));
    u.uRes.value.set(W, H);
    u.uColor.value.set(p.color);
    u.uColor2.value.set(p.color2 ?? '#000000');
    u.uOffset.value.set((p.dx ?? 0) * k, -(p.dy ?? 0) * k);
    Object.entries({ uMode: Math.max(0, ['glow', 'shadow', 'silhouette', 'contour'].indexOf(p.effect)), uRadius: (p.size ?? 0) * k, uStrength: p.strength ?? 1,
      uWidth: (p.width ?? 6) * k, uGap: (p.gap ?? 0) * k, uRings: Math.round(p.rings ?? 2), uKeep: p.keep ?? true }).forEach(([n, v]) => { u[n].value = v; });
    this.sigma = p.effect === 'shadow' ? u.uRadius.value * .5 : 0;
    this.reach = { glow: u.uRadius.value * 2,
      contour: u.uRings.value * (u.uWidth.value + u.uGap.value) + u.uGap.value }[p.effect] ?? 0;
  }
  prepare(src) {
    const { renderer, W, H } = this.engine, u = this.mesh.material.uniforms;
    super.prepare(src);
    if (this.reach > 0) u.tSeed.value = this.jfa.run(renderer, src, Math.min(this.reach + 2, 2048), W, H);
  }
  dispose() { super.dispose(); this.jfa.dispose(); }
}

const LAYERS = { video: VideoLayer, audio: AudioLayer, image: ImageLayer, bubble: BubbleLayer, title: TitleLayer, shape: ShapeLayer,
  redact: RedactLayer, adjust: AdjustLayer, effect: EffectLayer, avatar: SceneLayer, background: SceneLayer };

class Engine extends EventTarget {
  layers = new Map(); exporting = false; W = 0; H = 0; #pending = 0; #pools = [[], [], []]; #used = [0, 0, 0];
  constructor() {
    super();
    this.renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    this.camera = new THREE.OrthographicCamera(0, 1, 1, 0, -10, 10);
    this.scene = new THREE.Scene();
    this.blit = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
      uniforms: { map: { value: null } }, vertexShader: FULLSCREEN_VERT, fragmentShader: BLIT_FRAG, depthTest: false, depthWrite: false }));
    this.blit.frustumCulled = false;
    this.blitScene = new THREE.Scene().add(this.blit);
    this.under = new THREE.Mesh(UNIT_PLANE, compMaterial(true));
    Object.assign(this.under, { renderOrder: -1e9, visible: false });
    this.scene.add(this.under);
    store.addEventListener('change', () => { this.sync(); this.requestRender(); });
    store.addEventListener('time', () => this.requestRender());
    store.addEventListener('plugins', () => { this.sync(true); this.requestRender(); });
  }
  resize(W, H) {
    Object.assign(this, { W, H });
    this.renderer.setSize(W, H, false);
    Object.assign(this.camera, { right: W, top: H });
    this.camera.updateProjectionMatrix();
    this.rt?.dispose(); this.rt2?.dispose();
    for (const rt of [...this.#pools[0], ...this.#pools[1]]) rt.dispose();
    for (const m of this.#pools[2]) { this.scene.remove(m); m.material.dispose(); }
    this.#pools = [[], [], []];
    [this.rt, this.rt2] = [0, 1].map(() => new THREE.WebGLRenderTarget(W, H, { samples: 4, type: THREE.HalfFloatType }));
    this.under.scale.set(W, H, 1);
    this.under.position.set(W / 2, H / 2, 0);
    for (const l of this.layers.values()) l.dispose();
    this.layers.clear();
  }
  sync(rebuildPlugins = false) {
    const { width, height } = store.project.settings, live = new Set();
    if (width !== this.W || height !== this.H) this.resize(width, height);
    for (const [, clip] of store.clips()) {
      if (!LAYERS[clip.type]) continue;
      const sig = `${clip.type}|${clip.plugin}|${media.get(clip.props.asset)?.url}`;
      let layer = this.layers.get(clip.id);
      if (layer && (layer.sig !== sig || (rebuildPlugins && clip.plugin))) { layer.dispose(); layer = null; }
      if (!layer) {
        layer = new LAYERS[clip.type](this, clip);
        Object.assign(layer, { sig, clipId: clip.id });
        this.layers.set(clip.id, layer);
      }
      live.add(clip.id);
    }
    for (const [id, l] of this.layers) if (!live.has(id)) { l.dispose(); this.layers.delete(id); }
  }
  requestRender() {
    this.#pending ||= requestAnimationFrame(() => { this.#pending = 0; if (!this.exporting) this.render(store.time); });
  }
  render(t) {
    const { tracks, settings } = store.project, active = [], talking = new Map(), actions = new Map();
    tracks.forEach((track, i) => track.clips.forEach(clip => {
      const on = !track.hidden && t >= clip.start && t < clip.start + clip.duration, lt = t - clip.start;
      if (clip.type === 'action') {
        if (on && clip.props.target && clip.props.action) {
          if (!actions.has(clip.props.target)) actions.set(clip.props.target, []);
          actions.get(clip.props.target).push({ name: clip.props.action, t: lt, u: lt / clip.duration, duration: clip.duration,
            weight: transitionMods(clip, lt).opacity, params: evalAll(clip, lt) });
        }
        return;
      }
      const layer = this.layers.get(clip.id);
      if (!layer) return;
      layer.active = layer.mesh.visible = !track.hidden && t >= clip.start && t < clip.start + clip.duration;
      if (!layer.active) return layer.idle?.();
      layer.mesh.renderOrder = tracks.length - i;
      active.push({ clip, layer, lt: t - clip.start });
    }));
    for (const { clip, lt } of active) if (clip.type === 'bubble' && clip.props.avatar)
      talking.set(clip.props.avatar, Math.max(talking.get(clip.props.avatar) ?? 0, transitionMods(clip, lt).vis));
    const rank = c => depthOf(c) + (c.type === 'bubble') * 50;
    active.sort((a, b) => rank(a.clip) - rank(b.clip));
    const ctx = { t, talking, actions, exporting: this.exporting };
    for (const { clip, layer, lt } of active) layer.update(lt, clip, ctx);
    this.composite(active.map(a => a.layer).filter(l => l.mesh.visible), settings.background);
    this.renderer.setRenderTarget(null);
    this.renderer.render(this.blitScene, this.camera);
    this.dispatchEvent(new Event('rendered'));
  }
  composite(layers, background) {
    const order = l => l.mesh.renderOrder, plain = layers.filter(l => !l.filter), swaps = new Map(), cuts = [];
    layers.sort((a, b) => order(a) - order(b));
    for (const f of layers.filter(l => l.filter)) {
      if (f.backdrop) { cuts.push(f); continue; }
      const src = f.source === null ? plain.findLast(l => order(l) < order(f)) : plain.find(l => l.clipId === f.source);
      if (src && !src.backdrop) swaps.set(src, [...swaps.get(src) ?? [], f]);
    }
    for (const l of plain) if (l.backdrop) cuts.push(l);
    cuts.sort((a, b) => order(a) - order(b));
    this.#used = [0, 0, 0];
    const shown = [...swaps].reduce((list, [src, fs]) => {
      let tex = this.#isolate(src);
      for (const f of fs) { f.prepare(tex); tex = this.#draw(this.#take(1), [f.mesh], tex, 0, 0); }
      const proxy = this.#take(2);
      Object.assign(proxy.material.uniforms.map, { value: tex });
      Object.assign(proxy.material, { blendSrc: src.mesh.material.blendSrc, blendDst: src.mesh.material.blendDst });
      proxy.renderOrder = order(src);
      return list.map(l => l === src ? { mesh: proxy } : l);
    }, plain.filter(l => !l.backdrop));
    let target = this.rt, back = null;
    for (let i = 0; i <= cuts.length; i++) {
      const cut = cuts[i - 1], lo = cut ? order(cut) : -Infinity, hi = cuts[i] ? order(cuts[i]) : Infinity;
      cut?.prepare(back);
      const meshes = shown.filter(l => order(l) > lo && order(l) <= hi).map(l => l.mesh);
      back = this.#draw(target, cut ? [cut.mesh, ...meshes] : meshes, back, background, 1);
      target = target === this.rt ? this.rt2 : this.rt;
    }
    for (const o of this.scene.children) o.visible = false;
    for (const l of layers) l.mesh.visible = true;
    this.blit.material.uniforms.map.value = back;
  }
  #draw(target, meshes, back, color, alpha) {
    const keep = new Set(meshes);
    for (const o of this.scene.children) o.visible = keep.has(o) || (o === this.under && !!back);
    this.under.material.uniforms.map.value = back;
    this.renderer.setRenderTarget(target);
    this.renderer.setClearColor(color, alpha);
    this.renderer.render(this.scene, this.camera);
    return target.texture;
  }
  #isolate(src) {
    const mat = src.mesh.material, blend = [mat.blendSrc, mat.blendDst];
    [mat.blendSrc, mat.blendDst] = BLENDS.normal;
    const tex = this.#draw(this.#take(0), [src.mesh], null, 0, 0);
    [mat.blendSrc, mat.blendDst] = blend;
    return tex;
  }
  #take(kind) {
    const pool = this.#pools[kind], i = this.#used[kind]++;
    if (pool[i]) return pool[i];
    if (kind < 2) return pool[i] = new THREE.WebGLRenderTarget(this.W, this.H, { samples: kind ? 0 : 4, type: THREE.HalfFloatType });
    const mesh = pool[i] = new THREE.Mesh(UNIT_PLANE, compMaterial(true));
    mesh.scale.set(this.W, this.H, 1);
    mesh.position.set(this.W / 2, this.H / 2, 0);
    this.scene.add(mesh);
    return mesh;
  }
}

/* ---------- playback, editing commands ---------- */

const frameRound = t => Math.round(t * store.project.settings.fps) / store.project.settings.fps;
function play() {
  if (store.playing) return;
  const { duration } = store.project.settings;
  if (store.time >= duration - 1e-3) store.seek(0);
  store.playing = true;
  store.emit('play');
  const t0 = performance.now(), s0 = store.time;
  const tick = now => {
    if (!store.playing) return;
    const t = s0 + (now - t0) / 1000;
    if (t >= duration) { store.seek(duration); return pause(); }
    store.seek(t);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function pause() {
  store.playing = false;
  store.seek(frameRound(store.time));
  store.emit('play');
}
const togglePlay = () => store.playing ? pause() : play();
const step = dt => { pause(); store.seek(frameRound(store.time + dt)); };

function clipFromItem(item, t) {
  if (item.kind === 'preset') return presetLib.clip(item.id);
  if (item.kind === 'bubble') return newClip('bubble');
  if (['title', 'shape', 'redact', 'adjust', 'effect'].includes(item.kind)) {
    const sel = store.clip, aim = item.kind === 'effect' && FILTERABLE.includes(sel?.type) && { apply: 'clip', source: sel.id };
    return overlayClip({ ...item, props: { ...item.props, ...aim } });
  }
  if (item.kind === 'action') {
    const avatars = [...store.clips()].map(([, c]) => c).filter(c => c.type === 'avatar' && c.plugin === item.plugin);
    const target = avatars.find(c => c.start <= t && t < c.start + c.duration) ?? avatars[0];
    return newAction(item.plugin, item.action, target?.id ?? '');
  }
  if (item.kind === 'plugin') {
    const p = plugins.get(item.id);
    return newClip(p.kind, { plugin: p.id, duration: p.kind === 'background' ? store.project.settings.duration : 5 });
  }
  const a = store.project.assets.find(a => a.id === item.id);
  const sticker = a.kind === 'image' && media.get(a.id)?.alpha && { fit: 'none', border: 10, shadow: 14 };
  return presetClip(a.kind, { asset: a.id, ...sticker }, { name: a.name, duration: a.duration || 5 });
}
function addClip(item, { track, t = store.time } = {}) {
  const clip = clipFromItem(item, t);
  clip.start = frameRound(t);
  if (clip.type === 'bubble') {
    const speaker = [...store.clips()].find(([, c]) => c.type === 'avatar' && c.start <= t && t < c.start + c.duration);
    if (speaker) clip.props.avatar = speaker[1].id;
  }
  if (!track) {
    track = newTrack(CLIP_TYPES[clip.type].label);
    const under = ['background', 'video', 'audio'].includes(clip.type) || clip.type === 'image' && !clip.props.border && !clip.props.shadow;
    store.project.tracks[under ? 'push' : 'unshift'](track);
  }
  track.clips.push(clip);
  store.commit();
  store.select(clip.id);
}
function deleteSelected() {
  const found = store.findClip(store.selection);
  if (!found) return;
  for (const [, c] of store.clips()) if (c.props.parent === found.clip.id) rebase('parent')(c, '', clamp(store.time - c.start, 0, c.duration), found.clip.id);
  found.track.clips.splice(found.track.clips.indexOf(found.clip), 1);
  store.select(null);
  store.commit();
}
function duplicateSelected() {
  const found = store.findClip(store.selection);
  if (!found) return;
  const copy = { ...structuredClone(found.clip), id: uid(), start: found.clip.start + found.clip.duration };
  found.track.clips.push(copy);
  store.commit();
  store.select(copy.id);
}
function splitSelected() {
  const found = store.findClip(store.selection), t = frameRound(store.time);
  if (!found) return toast('Select a clip to split');
  const { clip, track } = found, cut = t - clip.start;
  if (cut <= 0 || cut >= clip.duration) return toast('Move the playhead inside the selected clip to split it');
  const tail = {
    ...structuredClone(clip), id: uid(), start: t, duration: clip.duration - cut, in: clip.in + cut,
    keys: shiftKeys(clip.keys, -cut), tin: { ...clip.tin, type: 'none' },
  };
  Object.assign(clip, { duration: cut, tout: { ...clip.tout, type: 'none' } });
  track.clips.splice(track.clips.indexOf(clip) + 1, 0, tail);
  store.commit();
  store.select(tail.id);
}
function removeAsset(id) {
  store.project.assets = store.project.assets.filter(a => a.id !== id);
  for (const track of store.project.tracks) track.clips = track.clips.filter(c => c.props.asset !== id);
  if (!store.findClip(store.selection)) store.select(null);
  store.commit();
}

/* ---------- styles and presets ---------- */

const REFS = ['asset', 'image', 'source', 'parent', 'avatar', 'target', 'action'];
const STYLE_SKIP = new Set([...REFS, 'text', 'title', 'subtitle', 'apply', 'anchor', 'x', 'y', 'follow', 'progress', 'orient']);
const PRESETABLE = ['bubble', 'title', 'shape', 'redact', 'adjust', 'effect', 'avatar', 'background'];
function styleOf(clip, skip = STYLE_SKIP) {
  const pick = o => Object.fromEntries(Object.entries(o).filter(([k]) => !skip.has(k)));
  return structuredClone({ type: clip.type, plugin: clip.plugin, props: pick(clip.props), keys: pick(clip.keys), tin: clip.tin, tout: clip.tout });
}
function applyStyle(clip, style) {
  const done = new Set();
  for (let pass = 0; pass < 2; pass++) {
    const params = paramsFor(clip);
    for (const [k, v] of Object.entries(style.props)) {
      if (!params[k] || typeof v !== typeof params[k].default) continue;
      clip.props[k] = structuredClone(v);
      if (style.keys[k]) clip.keys[k] = structuredClone(style.keys[k]);
      else delete clip.keys[k];
      done.add(k);
    }
  }
  Object.assign(clip, structuredClone({ tin: style.tin, tout: style.tout }));
  return done.size;
}
let copiedStyle = null;
function copyStyle() {
  const clip = store.clip;
  if (!clip) return toast('Select a clip to copy its style');
  copiedStyle = styleOf(clip);
  store.emit('style');
  toast(`Copied the style of ${clip.name}`);
}
function pasteStyle() {
  const clip = store.clip;
  if (!clip || !copiedStyle) return toast(clip ? 'Copy a style first (Ctrl+Alt+C)' : 'Select a clip to paste a style onto');
  const n = applyStyle(clip, copiedStyle);
  store.commit();
  toast(n ? `Pasted ${n} style settings onto ${clip.name}` : `Nothing in the copied style applies to ${clip.name}`);
}
const presetLib = {
  key: 'overlay-studio-presets',
  all() { try { return JSON.parse(localStorage.getItem(this.key)) ?? []; } catch { return []; } },
  write(list) {
    try { localStorage.setItem(this.key, JSON.stringify(list)); } catch { return toast('This browser blocked saving presets'); }
    store.emit('presets');
  },
  add(clip, name) { this.write([...this.all(), { ...styleOf(clip, new Set(REFS)), id: uid(), name, duration: clip.duration, path: clip.path }]); },
  remove(id) { this.write(this.all().filter(p => p.id !== id)); },
  clip(id) {
    const pr = this.all().find(p => p.id === id);
    if (!pr) throw new Error('That preset no longer exists');
    const clip = newClip(pr.type, { plugin: pr.plugin, name: pr.name, duration: pr.duration });
    applyStyle(clip, pr);
    if (pr.path) clip.path = pr.path;
    if (clip.props.apply === 'clip') Object.assign(clip.props, FILTERABLE.includes(store.clip?.type) ? { source: store.clip.id } : { apply: 'below' });
    return clip;
  },
};

/* ---------- project files ---------- */

const MAGIC = 'VPRJ';
function downloadBlob(blob, name) {
  const a = h('a', { href: URL.createObjectURL(blob), download: name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60_000);
}
async function saveFile(blob, name) {
  if (window.showSaveFilePicker) {
    try {
      const handle = await showSaveFilePicker({ suggestedName: name });
      const w = await handle.createWritable();
      await w.write(blob);
      await w.close();
      return true;
    } catch (e) { if (e.name === 'AbortError') return false; }
  }
  downloadBlob(blob, name);
  return true;
}
async function saveProject(consolidate = false) {
  const all = store.project.assets;
  if (consolidate && all.some(a => a.linked && media.has(a.id))) {
    for (const a of all) if (media.has(a.id)) a.linked = false;
    store.commit();
  }
  const missing = all.filter(a => !media.has(a.id)).length;
  if (missing) toast(`${missing} missing file(s) saved as links only: relink them in the Media list to embed them`);
  const blobs = [], assets = [];
  let offset = 0;
  for (const a of all) {
    const m = !a.linked && media.get(a.id);
    if (!m) { assets.push({ ...a }); continue; }
    assets.push({ ...a, offset, size: m.blob.size });
    blobs.push(m.blob);
    offset += m.blob.size;
  }
  const sources = [...plugins.values()].filter(p => p.source).map(p => p.source);
  const json = new TextEncoder().encode(JSON.stringify({ version: 1, project: { ...store.project, assets }, plugins: sources }));
  const head = new DataView(new ArrayBuffer(12));
  [...MAGIC].forEach((ch, i) => head.setUint8(i, ch.charCodeAt(0)));
  head.setUint32(4, 1, true);
  head.setUint32(8, json.length, true);
  if (await saveFile(new Blob([head, json, ...blobs], { type: 'application/octet-stream' }), `${store.project.settings.name || 'project'}.vproj`)) {
    store.dirty = false;
    autosave.schedule(0);
  }
}
async function openProject(file) {
  const head = new DataView(await file.slice(0, 12).arrayBuffer());
  if (String.fromCharCode(...[0, 1, 2, 3].map(i => head.getUint8(i))) !== MAGIC) throw new Error('Not an Overlay Studio project');
  const base = 12 + head.getUint32(8, true);
  await loadProject(JSON.parse(await file.slice(12, base).text()), a => {
    const { offset } = a;
    delete a.offset;
    return offset === undefined ? null : file.slice(base + offset, base + offset + a.size, a.mime);
  });
}
async function loadProject({ project, plugins: sources = [] }, blobOf) {
  for (const src of sources) await loadPluginSource(src).catch(e => toast(`Plugin failed to load: ${e.message}`));
  let missing = 0;
  for (const a of project.assets) {
    const blob = await blobOf(a);
    if (blob) await addMedia(a, blob);
    else if (!await restoreLinked(a) && !media.has(a.id)) missing++;
  }
  pause();
  store.load(project);
  if (missing) toast(`${missing} linked file(s) need relinking: click them in the Media list`);
}
const emptyProject = () => ({
  settings: { name: 'Untitled', width: 1920, height: 1080, fps: 30, duration: 10, background: '#101014' },
  assets: [], tracks: [newTrack('Track 1')],
});
function demoProject() {
  const p = emptyProject(), duration = p.settings.duration;
  const sky = newClip('background', { plugin: 'clouds', duration });
  const ghost = newClip('avatar', { plugin: 'ghost', duration });
  Object.assign(ghost.props, { x: 30, y: 58 });
  ghost.keys.yaw = [{ t: 0, v: -25, ease: 'ease-in-out' }, { t: 4, v: 25, ease: 'ease-in-out' }, { t: 8, v: -10, ease: 'linear' }];
  const hello = newClip('bubble', { start: 1, duration: 3.5 });
  Object.assign(hello.props, { text: 'Boo! Welcome to Overlay Studio.', avatar: ghost.id, x: 64, y: 24 });
  const tip = newClip('bubble', { start: 5.5, duration: 4 });
  Object.assign(tip.props, { text: 'Drag clips around the timeline, and set keyframes with the diamond buttons.', style: 'thought', avatar: ghost.id, x: 66, y: 25, fontSize: 40 });
  tip.tin = { type: 'typewriter', dur: 1.6, ease: 'linear' };
  const moves = [newAction('ghost', 'nod', ghost.id, 1.6), newAction('ghost', 'jump', ghost.id, 4.4), newAction('ghost', 'shiver', ghost.id, 7.6)];
  p.tracks = [{ ...newTrack('Bubbles'), clips: [hello, tip] }, { ...newTrack('Actions'), clips: moves }, { ...newTrack('Avatar'), clips: [ghost] }, { ...newTrack('Background'), clips: [sky] }];

/* ---------- autosave and crash recovery ---------- */

const readFile = (dir, name) => dir.getFileHandle(name).then(f => f.getFile(), () => null);

      if (restore) await this.restore(saved);

      const stale = [];

      for (const name of stale) await this.media.removeEntry(name);

      return f && f.slice(0, f.size, a.mime);

/* ---------- export ---------- */

async function mixAudio(duration) {
  const clips = [...store.clips()].filter(([tr, c]) => !tr.hidden && ['video', 'audio'].includes(c.type) && media.has(c.props.asset));
  if (!clips.length) return null;
  const ctx = new OfflineAudioContext(2, Math.ceil(duration * 48000), 48000);
  let any = false;
  for (const [, c] of clips) {
    const buf = await decodeAudio(c.props.asset), len = Math.min(c.duration, duration - c.start);
    if (!buf || len <= 0) continue;

    if (!curve.some(Boolean)) continue;

    src.connect(gain).connect(ctx.destination);
    src.start(c.start, c.in, len);
    any = true;
  }
  return any ? ctx.startRendering() : null;
}
async function openVideoFeeds(MB, fps, frames) {
  const feeds = [];
  for (const [track, clip] of store.clips()) {
    const layer = engine.layers.get(clip.id), m = media.get(clip.props.asset);
    if (track.hidden || clip.type !== 'video' || !layer || !m) continue;
    const input = new MB.Input({ formats: MB.ALL_FORMATS, source: new MB.BlobSource(m.blob) });
    const vt = await input.getPrimaryVideoTrack();
    if (!vt) continue;
    const inside = t => t >= clip.start && t < clip.start + clip.duration, times = [];
    for (let f = 0; f < frames; f++) if (inside(f / fps)) times.push(clip.in + f / fps - clip.start);
    const it = new MB.CanvasSink(vt, { poolSize: 2 }).canvasesAtTimestamps(times);
    feeds.push({
      pull: async t => { if (inside(t)) layer.exportFrame = (await it.next()).value?.canvas ?? null; },
      close: () => { it.return(); input.dispose?.(); layer.exportFrame = null; },
    });
  }
  return feeds;
}
async function exportVideo({ format, quality, audio }, onProgress, signal) {
  const MB = await import('mediabunny');
  const { width: W, height: H, fps, duration } = store.project.settings, q = MB[quality];
  const fmt = format === 'webm' ? new MB.WebMOutputFormat() : new MB.Mp4OutputFormat({ fastStart: 'in-memory' });
  const vcodec = await MB.getFirstEncodableVideoCodec(fmt.getSupportedVideoCodecs(), { width: W, height: H, bitrate: q });
  if (!vcodec) throw new Error(`This browser cannot encode ${format.toUpperCase()} video at ${W}×${H}`);
  const fonts = [...store.clips()].flatMap(([, { type, props: p }]) => type === 'bubble' ? [[p.weight, p.font]] : type === 'title' ? [[p.weight, p.font], [p.subWeight, p.subFont]] : []);
  await Promise.all(fonts.map(([w, f]) => document.fonts.load(`${w} 40px "${f}"`)));

  let sound = null;

  }
  saveView(persist = true) {
    if (persist) try { localStorage.setItem('overlay-studio-view', JSON.stringify(this.view)); } catch {}
    for (const box of this.$('.view-menu').querySelectorAll('input')) box.checked = !!this.view[box.dataset.opt];

  pathTarget() {

    const d = ed.nodes.map((n, i) => i ? `C${handle(ed.nodes[i - 1], 'o')} ${handle(n, 'i')} ${at(n)}` : `M${at(n)}`).join(' ');

  framePx(e) {

  }
  pick(e) {
    const r = this.canvas.getBoundingClientRect();

    const hit = layer => { const p = layer.mesh.worldToLocal(v.clone()); return Math.abs(p.x) <= .5 && Math.abs(p.y) <= .5; };

    const [kx, ky] = clip.type === 'bubble' && clip.props.avatar && clip.props.follow === 'bubble' ? ['offsetX', 'offsetY'] : ['x', 'y'];
    const onPath = clip.path && evalProp(clip, 'follow', lt) && !(clip.type === 'shape' && clip.props.shape === 'arrow');
    const start = n => evalProp(clip, n, lt) ?? paramsFor(clip)[n].default;
    this.drag = { id, lt, kx, ky, x0: e.clientX, y0: e.clientY, px: start(kx), py: start(ky), w: r.width, h: r.height, moved: false,

  move(e) {

    if (d.xf) { const [ax, ay] = d.xf.from(0, 0), [bx, by] = d.xf.from(dx, dy); [dx, dy] = [bx - ax, by - ay]; }

    } else if (e.target.closest?.('.hit')) {

  }
}

const liveAsset = id => store.project.assets.find(a => a.id === id);
class Assets extends Component {
  connectedCallback() {
    this.$('.import').onclick = () => this.importDialog();
    const pop = this.$('.plugin-pop'), form = this.$('form');
    form.onsubmit = async e => {
      e.preventDefault();
      try { await loadPluginUrl(form.url.value); pop.hidePopover(); form.reset(); } catch (err) { toast(`Plugin failed to load: ${err.message}`); }
    };
    this.$('.from-file').onclick = () => { pop.hidePopover(); this.importDialog(); };
    this.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); this.classList.add('dragover'); } });
    this.addEventListener('dragleave', () => this.classList.remove('dragover'));
    this.addEventListener('drop', e => {
      if (!e.dataTransfer.files.length) return;
      e.preventDefault(); e.stopPropagation();
      this.classList.remove('dragover');
      dropEntries(e.dataTransfer).then(importFiles);
    });
    store.addEventListener('change', () => this.render());
    store.addEventListener('plugins', () => this.render(true));
    store.addEventListener('presets', () => this.render(true));
    this.render();
  }
  importDialog() { return pickFiles().then(importFiles); }
  render(force) {
    const { assets } = store.project, presets = presetLib.all();
    const sig = JSON.stringify([assets.map(a => [a.id, a.linked, media.get(a.id)?.url]), [...plugins.keys()], presets.map(p => [p.id, p.name])]);
    if (!force && sig === this.sig) return;
    this.sig = sig;
    const byKind = kind => [...plugins.values()].filter(p => p.kind === kind)
      .map(p => this.item({ payload: { kind: 'plugin', id: p.id }, name: p.name, meta: p.source ? 'Plugin' : 'Built-in', ic: CLIP_TYPES[kind].icon }));
    this.$('.media').replaceChildren(...assets.map(a => this.mediaItem(a)));
    this.$('.empty').hidden = assets.length > 0;
    this.$('.avatar').replaceChildren(...byKind('avatar'));
    this.$('.action').replaceChildren(...avatarActions().map(({ plugin, action, label }) =>
      this.item({ payload: { kind: 'action', plugin: plugin.id, action }, name: label, meta: plugin.name, ic: 'bolt' })));
    this.$('.background').replaceChildren(...byKind('background'));
    this.$('.overlay').replaceChildren(...OVERLAYS.map(({ name, ic, payload }) => this.item({ payload, name, meta: CLIP_TYPES[payload.kind].label, ic })));
    this.$('.mine').hidden = !presets.length;
    this.$('.presets').replaceChildren(...presets.map(p => this.item({ payload: { kind: 'preset', id: p.id }, name: p.name,
      meta: plugins.get(p.plugin)?.name ?? CLIP_TYPES[p.type]?.label, ic: CLIP_TYPES[p.type]?.icon ?? 'star', remove: () => presetLib.remove(p.id) })));
  }
  mediaItem({ id, name, kind, linked, width, height, duration }) {
    const m = media.get(id), remove = () => removeAsset(id);
    if (!m) return this.item({ name, meta: 'Missing: click to relink', ic: kind, remove, cls: 'missing', onclick: () => relink(liveAsset(id)) });
    const meta = [kind !== 'audio' && `${width}×${height}`, kind !== 'image' && duration && `${duration.toFixed(1)}s`].filter(Boolean).join(' · ');
    const badge = h('button', {
      class: 'badge', title: linked ? 'Linked to a file on disk: click to embed it in the project' : 'Embedded in the project: click to link to the file on disk',
      onclick: e => { e.stopPropagation(); toggleLinked(liveAsset(id)); },
    }, linked ? 'Linked' : 'Embedded');
    return this.item({ payload: { kind: 'asset', id }, name, meta, thumb: m.thumb, ic: kind, remove, badge });
  }
  item({ payload, name, meta, thumb, ic, remove, badge, cls = '', onclick }) {
    const drag = payload ? {

      h('div', { class: 'name' }, name), h('div', { class: 'meta' }, meta), badge,
      remove && h('button', { class: 'icon-btn rm', title: 'Remove from project', onclick: e => { e.stopPropagation(); remove(); } }, icon('x')));
  }
}

class RecoverDialog extends Component {
  connectedCallback() {
    this.dialog = this.$('dialog');
    this.dialog.addEventListener('cancel', e => e.preventDefault());
  }
  ask({ project, savedAt }, preview) {
    const clips = project.tracks.reduce((n, t) => n + t.clips.length, 0), linked = project.assets.filter(a => a.linked).length, img = this.$('img');
    this.$('.summary').textContent = `“${project.settings.name || 'Untitled'}” with ${clips} clip${clips === 1 ? '' : 's'} and ${project.assets.length} media file${project.assets.length === 1 ? '' : 's'}, autosaved ${relTime(savedAt)}.`;
    this.$('.note').textContent = [linked && `${linked} linked file${linked === 1 ? '' : 's'} may ask for permission to be read again.`, 'Discard deletes this autosave.'].filter(Boolean).join(' ');
    img.hidden = !preview;
    if (preview) img.src = URL.createObjectURL(preview);
    img.style.aspectRatio = `${project.settings.width} / ${project.settings.height}`;
    this.dialog.showModal();
    return new Promise(ok => {
      const done = v => () => { this.dialog.close(); URL.revokeObjectURL(img.src); ok(v); };
      this.$('.restore').onclick = done(true);
      this.$('.discard').onclick = done(false);
    });
  }
}

class ExportDialog extends Component {
  opts = { format: 'mp4', quality: 'QUALITY_HIGH', audio: true };
  connectedCallback() {
    this.dialog = this.$('dialog');
    const bind = key => ({ get: () => this.opts[key], set: v => { this.opts[key] = v; } });
    this.$('.fields').replaceChildren(
      h('vt-field').bind(choice('Format', 'mp4', [['mp4', 'MP4 (H.264 or HEVC, AAC)'], ['webm', 'WebM (VP9 or AV1, Opus)']]), bind('format')),
      h('vt-field').bind(choice('Quality', 'QUALITY_HIGH', [['QUALITY_MEDIUM', 'Medium'], ['QUALITY_HIGH', 'High'], ['QUALITY_VERY_HIGH', 'Very high']]), bind('quality')),
      h('vt-field').bind(flag('Include audio', true), bind('audio')));
    this.$('.go').onclick = () => this.run();
    this.$('.close').onclick = () => this.ac ? this.ac.abort() : this.dialog.close();
  }
  open() {
    const { width, height, fps, duration } = store.project.settings;
    this.$('.summary').textContent = `${width}×${height} at ${fps} fps, ${duration}s (${Math.round(duration * fps)} frames)`;
    this.$('progress').value = 0;
    this.$('.status').textContent = '';
    this.$('.dl').hidden = true;
    this.dialog.showModal();
  }
  async run() {
    const go = this.$('.go'), status = this.$('.status'), close = this.$('.close'), t0 = performance.now();
    this.ac = new AbortController();
    go.disabled = true;
    close.textContent = 'Cancel';
    try {
      const blob = await exportVideo(this.opts, (p, f, n) => {
        this.$('progress').value = p;
        status.textContent = `Rendering frame ${f} of ${n}`;
      }, this.ac.signal);
      const name = `${store.project.settings.name || 'export'}.${this.opts.format}`;
      status.textContent = `Done: ${(blob.size / 1e6).toFixed(1)} MB in ${((performance.now() - t0) / 1000).toFixed(1)}s`;
      downloadBlob(blob, name);
      Object.assign(this.$('.dl'), { hidden: false, href: URL.createObjectURL(blob), download: name });
    } catch (e) {
      status.textContent = e.name === 'AbortError' ? 'Export cancelled' : `Export failed: ${e.message}`;
      console.error(e);
    } finally {
      this.ac = null;
      go.disabled = false;
      close.textContent = 'Close';
    }
  }
}

/* ---------- boot ---------- */

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  if (!el.matches(':popover-open')) el.showPopover();
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.hidePopover(), 4500);
}
addEventListener('unhandledrejection', e => toast(e.reason?.message ?? String(e.reason)));

[ghostPlugin, snowPlugin, starsPlugin, cloudsPlugin, vortexPlugin].forEach(p => registerPlugin(p));
const engine = new Engine();
store.load(demoProject());
Object.assign(window, { overlayStudio: { THREE, store, engine, registerPlugin, exportVideo, saveProject, openProject, importFiles, addClip, OVERLAYS, evalAll, presets: presetLib, copyStyle, pasteStyle, autosave } });

customElements.define('vt-field', Field);
customElements.define('vt-props', Props);
customElements.define('vt-curves', Curves);
customElements.define('vt-timeline', Timeline);
customElements.define('vt-viewport', Viewport);
customElements.define('vt-assets', Assets);
customElements.define('vt-export', ExportDialog);
customElements.define('vt-recover', RecoverDialog);

const root = document.documentElement, darkQuery = matchMedia('(prefers-color-scheme: dark)');
const themeIcon = () => setIcon(document.querySelector('[data-act="theme"] svg'),
  (root.dataset.theme ?? (darkQuery.matches ? 'dark' : 'light')) === 'dark' ? 'sun' : 'moon');
try { const saved = localStorage.getItem('theme'); if (saved) root.dataset.theme = saved; } catch {}
darkQuery.addEventListener('change', themeIcon);
themeIcon();

const openInput = document.getElementById('open-file');
openInput.onchange = () => {
  const file = openInput.files[0];
  openInput.value = '';
  if (file) openProject(file).catch(e => toast(`Could not open project: ${e.message}`));
};
const ACTIONS = {
  new: () => { pause(); store.project = emptyProject(); store.select(null); store.commit(); store.seek(0); },
  open: () => openInput.click(),
  save: () => saveProject().catch(e => toast(`Could not save: ${e.message}`)),
  consolidate: () => saveProject(true).catch(e => toast(`Could not save: ${e.message}`)),
  undo: () => store.undo(),
  redo: () => store.redo(),
  split: splitSelected,
  export: () => document.querySelector('vt-export').open(),
  theme: () => {
    const next = (root.dataset.theme ?? (darkQuery.matches ? 'dark' : 'light')) === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch {}
    themeIcon();
  },
};
const saveMenu = document.getElementById('save-menu');
document.addEventListener('click', e => {
  const act = e.target.closest?.('.toolbar [data-act], #save-menu [data-act]')?.dataset.act;
  if (!act) return;
  if (saveMenu.matches(':popover-open')) saveMenu.hidePopover();
  ACTIONS[act]?.();
});

const addMenu = document.getElementById('add-menu');
function buildAddMenu() {
  const item = (ic, label, payload) => h('button', { onclick: () => { addMenu.hidePopover(); addClip(payload); } }, icon(ic), label);
  const byKind = kind => [...plugins.values()].filter(p => p.kind === kind).map(p => item(CLIP_TYPES[kind].icon, p.name, { kind: 'plugin', id: p.id }));
  addMenu.replaceChildren(
    h('h4', {}, 'Overlays'), ...OVERLAYS.map(o => item(o.ic, o.name, o.payload)),
    ...(mine => mine.length ? [h('h4', {}, 'My presets'), ...mine.map(p => item(CLIP_TYPES[p.type]?.icon ?? 'star', p.name, { kind: 'preset', id: p.id }))] : [])(presetLib.all()),
    h('h4', {}, 'Avatars'), ...byKind('avatar'),

    h('h4', {}, 'Backgrounds'), ...byKind('background'),

const isTyping = e => {
  const el = e.composedPath()[0];
  return el instanceof HTMLElement && (el.matches('input:not([type=range]):not([type=checkbox]), textarea, select') || el.isContentEditable);
};
document.addEventListener('keydown', e => {
  if (isTyping(e) || document.querySelector('vt-export').dialog?.open || document.querySelector('vt-recover').dialog?.open) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase(), fps = store.project.settings.fps;
  const run = fn => { e.preventDefault(); fn(); };
  if (mod && e.altKey && e.code === 'KeyC') return run(copyStyle);
  if (mod && e.altKey && e.code === 'KeyV') return run(pasteStyle);
  if (mod && k === 'z') return run(e.shiftKey ? ACTIONS.redo : ACTIONS.undo);
  if (mod && k === 'y') return run(ACTIONS.redo);
  if (mod && k === 'd') return run(duplicateSelected);
  if (mod && k === 's') return run(e.shiftKey ? ACTIONS.consolidate : ACTIONS.save);
  if (mod && k === 'o') return run(ACTIONS.open);
  if (mod && k === 'e') return run(ACTIONS.export);
  if (mod) return;
  const keys = {
    ' ': togglePlay, 's': splitSelected, 'delete': deleteSelected, 'backspace': deleteSelected,
    'arrowleft': () => step(e.shiftKey ? -1 : -1 / fps), 'arrowright': () => step(e.shiftKey ? 1 : 1 / fps),
    'home': () => { pause(); store.seek(0); }, 'end': () => { pause(); store.seek(store.project.settings.duration); },
    'escape': () => store.select(null), 'g': () => document.querySelector('vt-viewport').toggleGuides(),
  };
  if (keys[k]) run(keys[k]);
});

document.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => {
  if (!e.dataTransfer.files.length) return;
  e.preventDefault();
  const project = [...e.dataTransfer.files].find(f => f.name.endsWith('.vproj'));
  if (project) openProject(project).catch(err => toast(`Could not open project: ${err.message}`));
  else dropEntries(e.dataTransfer).then(importFiles);
});

const splitter = document.querySelector('.splitter'), main = document.querySelector('main');
splitter.addEventListener('pointerdown', e => {
  splitter.setPointerCapture(e.pointerId);
  const y0 = e.clientY, h0 = document.querySelector('vt-timeline').getBoundingClientRect().height;
  const drag = ev => main.style.setProperty('--tl-h', `${clamp(h0 - (ev.clientY - y0), 140, innerHeight - 260)}px`);
  splitter.addEventListener('pointermove', drag);
  splitter.addEventListener('pointerup', () => splitter.removeEventListener('pointermove', drag), { once: true });
});
autosave.start();
